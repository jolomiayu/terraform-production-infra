version: '3'

services:

  frontend:

    image: nginx:latest

    container_name: salon-frontend

    ports:
      - "80:80"

    restart: always

    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./admin.html:/usr/share/nginx/html/admin.html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend

  backend:

    build: ./backend

    container_name: salon-backend

    ports:
      - "3000:3000"

    restart: always

    env_file:
      - ./backend/.env.example


