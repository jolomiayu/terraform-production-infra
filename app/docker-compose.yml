version: '3'

services:

  frontend:

    image: nginx:latest

    container_name: salon-frontend

    ports:
      - "80:80"

    restart: always

    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./admin.html:/usr/share/nginx/html/admin.html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend

  backend:

    build: ./backend

    container_name: salon-backend

    ports:
      - "3000:3000"

    restart: always

    env_file:
      - ./backend/.env.example

    depends_on:

      database:
        condition: service_healthy

  database:

    image: postgres:15

    container_name: salon-database

    restart: always

    environment:

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SalonHubPassword123!
      POSTGRES_DB: salonhub

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

volumes:

  postgres_data:
